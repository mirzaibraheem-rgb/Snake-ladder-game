# Builds and tests every platform. Runs on every push and can be started by hand
# (GitHub > Actions > "Build all platforms" > Run workflow). Download the results from the run's "Artifacts".
name: Build all platforms

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-web:
    name: Tests + Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        with: { name: web-version, path: dist }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-screenshots, path: screenshots }

  windows:
    name: Windows .exe (installer + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:win
      - name: Check the .exe reads an edited content folder (no rebuild)
        run: node tests/electron/content-override.mjs "release/win-unpacked/SOFT Snakes and Ladders.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            release/SOFT-Snakes-Ladders-Setup.exe
            release/SOFT-Snakes-Ladders-Portable.exe

  android:
    name: Android (.aab for Google Play, .apk for testing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      # The ubuntu runner already includes the Android SDK (ANDROID_HOME is set); Gradle fetches any missing parts.
      - run: npm ci
      - run: npm run build:web
      - run: npx cap sync android
      # Optional signing: add these repository secrets to get a signed, upload ready .aab.
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "SOFT_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        env:
          SOFT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SOFT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SOFT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS (compile check, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:ios
      - name: Build for the iOS Simulator (no signing needed)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  handover:
    name: Complete handover folder (one download)
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - name: Get the Windows .exe files built by the windows job
        uses: actions/download-artifact@v4
        with: { name: windows-exe, path: release }
      - name: Store screenshots at Play and App Store sizes
        run: |
          npx vite preview --port 4173 --strictPort &
          sleep 3
          node scripts/store-screenshots.mjs
      - run: node scripts/make-handover.mjs --no-zip
      - uses: actions/upload-artifact@v4
        with:
          name: SOFT_Snakes_and_Ladders_Handover
          path: SOFT_Snakes_and_Ladders_Handover
          retention-days: 90
